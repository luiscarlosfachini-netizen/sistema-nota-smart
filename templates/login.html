<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Login - NOTA SMART</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkcard: '#0a0a0a', darkborder: '#1f1f1f' } } } }
    </script>
</head>
<body class="bg-slate-100 dark:bg-black text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center transition-colors duration-200 p-4">

    <div class="bg-white dark:bg-darkcard w-full max-w-md p-8 rounded-2xl shadow-xl border border-slate-200 dark:border-darkborder text-center space-y-6">
        <div class="flex justify-center mb-4">
            <img src="/static/logo.png" alt="Logo" class="h-14 w-auto object-contain">
        </div>
        <h2 class="text-2xl font-bold">Painel de Acesso</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400">Faça login para gerenciar o sistema</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 bg-red-100 text-red-700 rounded-lg text-sm font-semibold border border-red-300">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-4 text-left">
            <div>
                <label class="text-xs font-semibold text-slate-500 uppercase">Usuário / E-mail</label>
                <input type="text" name="email" required class="w-full mt-1 p-3 rounded-lg bg-slate-50 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="text-xs font-semibold text-slate-500 uppercase">Senha</label>
                <input type="password" name="senha" required class="w-full mt-1 p-3 rounded-lg bg-slate-50 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition-colors mt-2 shadow-lg shadow-blue-500/30">
                Entrar no Sistema
            </button>
        </form>
    </div>

</body>
</html>
