<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NOTA SMART</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center h-screen">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-500">NOTA SMART</h1>
            <p class="text-slate-400 text-sm mt-1">Gestão de Clientes e Certificados</p>
        </div>

        {% if error %}
        <div class="bg-red-500/20 border border-red-500 text-red-300 p-3 rounded mb-4 text-sm 
text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-300 mb-1">Usuário</label>
                <input type="text" name="username" required class="w-full bg-slate-900 border 
border-slate-700 rounded p-2 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1">Senha</label>
                <input type="password" name="password" required class="w-full bg-slate-900 border 
border-slate-700 rounded p-2 text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-2 rounded 
transition">Entrar no Sistema</button>
        </form>
    </div>
</body>
</html>
